[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silkscan"
version = "0.1.0"
description = "EMBER2024 + LightGBM malware detection with pluggable feature groups (IBM Z ready)"
readme = "README.md"
requires-python = ">=3.10"
# Kept deliberately small: every native dependency is an install risk on s390x.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "lightgbm>=4.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["starlette>=0.47,<2", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "python-multipart>=0.0.22,<1"]
# Official EMBER feature version 3 vectorizer. signify>=0.9 breaks thrember's import.
# oscrypto 1.3.0 (latest on PyPI) cannot parse OpenSSL versions such as 3.0.13; the pinned commit can.
ember = [
    "thrember @ git+https://github.com/FutureComputing4AI/EMBER2024@0ef753e81d98bf209f71b03cd331dfc190b5b54d",
    "signify==0.8.1",
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@d5f3437ed24257895ae1edd9e503cfb352e635a8",
]
snapml = ["snapml"]
checks = ["yara-python"]
dev = ["pytest>=7", "scikit-learn"]

[project.scripts]
silkscan = "silkscan.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silkscan = ["features/data/*.yaml", "stage2/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
